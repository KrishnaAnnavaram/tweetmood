[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tweetmood"
version = "0.1.0"
description = "Hybrid BERT vs classic ML for tweet sentiment, with Gen-Z slang handling"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
torch = ["torch>=2.1"]
hf = ["torch>=2.1", "transformers>=4.40"]
all = ["tweetmood[torch,hf]"]
dev = ["pytest>=8"]

[project.scripts]
tweetmood = "tweetmood.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
